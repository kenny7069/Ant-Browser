name: Publish Farm Client Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: false
        default: "1.5.0"
        type: string
  push:
    branches: ["farm-client-dev"]
    tags: ["farm-client-v*"]

permissions:
  contents: write

env:
  FARM_CLIENT_CI_VERSION: "1.5.1"

concurrency:
  group: publish-farm-client-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04, variant: ubuntu-22.04-amd64 }
          - { arch: amd64, runner: ubuntu-24.04, variant: ubuntu-24.04-amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, variant: ubuntu-24.04-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install native Chromium on arm64
        if: matrix.arch == 'arm64'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          set -euo pipefail
          npx --yes playwright@1.63.0 install --with-deps --no-shell chromium
          chrome="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome -path '*/chromium-*/*' -print -quit)"
          test -x "$chrome"
          sandbox="$(dirname "$chrome")/chrome_sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%U:%G' "$sandbox")" = "root:root"
          test -u "$sandbox"
          export CHROME_DEVEL_SANDBOX="$sandbox"
          smoke_profile="$RUNNER_TEMP/chromium-arm64-smoke"
          mkdir -p "$smoke_profile"
          smoke_log="$RUNNER_TEMP/chromium-arm64-smoke.log"
          set +e
          timeout --kill-after=5s 15s "$chrome" --headless=new --no-first-run --no-default-browser-check \
            --disable-background-networking --user-data-dir="$smoke_profile" --remote-debugging-port=0 about:blank 2>"$smoke_log"
          smoke_status=$?
          set -e
          if ! grep -Fq 'DevTools listening on' "$smoke_log"; then
            cat "$smoke_log"
            exit "$smoke_status"
          fi
          echo "C8_PLAYWRIGHT_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          echo "CHROME_DEVEL_SANDBOX=$sandbox" >> "$GITHUB_ENV"
      - name: Test Farm Client backend
        run: go test ./backend/... -count=1
      - name: Install Secret Service test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring
      - name: Build dedicated artifacts
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$FARM_CLIENT_CI_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/farm-client-v* ]]; then version="${GITHUB_REF_NAME#farm-client-v}"; fi
          bash publish/farm-client/linux/package.sh --arch "${{ matrix.arch }}" --version "$version"
      - name: Validate package layouts
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$FARM_CLIENT_CI_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/farm-client-v* ]]; then version="${GITHUB_REF_NAME#farm-client-v}"; fi
          deb="$(ls publish/farm-client/linux/dist/ant-farm-client_*_${{ matrix.arch }}.deb)"
          archive="$(ls publish/farm-client/linux/dist/AntFarmClient-*-linux-${{ matrix.arch }}.tar.gz)"
          update="$(ls publish/farm-client/linux/dist/AntFarmClient-*-linux-${{ matrix.arch }}.update.bin)"
          dpkg-deb -I "$deb" >/dev/null
          # Do not use grep -q under pipefail: its early close makes dpkg's
          # tar writer report EPIPE even when the expected path is present.
          dpkg-deb -c "$deb" | grep -F '/opt/ant-farm-client/ant-farm-client' >/dev/null
          staging="$(mktemp -d)"
          tar -xzf "$archive" -C "$staging"
          test -x "$staging/ant-farm-client"
          test -x "$staging/bin/xray"
          test -x "$staging/bin/sing-box"
          test -f "$staging/config.example.yaml"
          "$staging/ant-farm-client" -version | grep -Fq "\"version\":\"$version\""
          "$update" -version | grep -Fq "\"version\":\"$version\""
      - name: Exercise installed Debian artifact with real Chrome
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$FARM_CLIENT_CI_VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/farm-client-v* ]]; then version="${GITHUB_REF_NAME#farm-client-v}"; fi
          artifact="$(realpath "$(ls publish/farm-client/linux/dist/ant-farm-client_${version}_${{ matrix.arch }}.deb)")"
          artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          chrome="${C8_PLAYWRIGHT_CHROMIUM:-$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)}"
          test -n "$chrome"
          sudo dpkg -i "$artifact"
          cleanup_package() {
            sudo dpkg -r ant-farm-client >/dev/null 2>&1 || true
          }
          trap cleanup_package EXIT
          C8_INSTALLED_ARTIFACT_E2E=1 \
          C8_INSTALLED_RECONNECT_RECONCILE_E2E=1 \
          C8_INSTALLED_CLIENT="/opt/ant-farm-client/ant-farm-client" \
          C8_INSTALLED_ROOT="/opt/ant-farm-client" \
          C8_RELEASE_ARTIFACT="$artifact" \
          C8_RELEASE_ARTIFACT_SHA256="$artifact_sha" \
          C8_INSTALLED_VERSION="$version" \
          C8_REAL_CHROME_CORE="$chrome" \
          go test ./backend -run '^TestFarmClientInstalledArtifact(RealChrome|ReconnectReconcile)$' -count=1 -v
          native_home="$(mktemp -d "$RUNNER_TEMP/ant-native-store-home.XXXXXX")"
          chmod 700 "$native_home"
          dbus-run-session -- env \
            HOME="$native_home" \
            C8_INSTALLED_NATIVE_IDENTITY_E2E=1 \
            ANT_FARM_CLIENT_NATIVE_STORE_E2E=1 \
            C8_INSTALLED_CLIENT="/opt/ant-farm-client/ant-farm-client" \
            C8_INSTALLED_ROOT="/opt/ant-farm-client" \
            C8_RELEASE_ARTIFACT="$artifact" \
            C8_RELEASE_ARTIFACT_SHA256="$artifact_sha" \
            C8_INSTALLED_VERSION="$version" \
            bash -euo pipefail -c '
              keyring_password="$(od -An -N32 -tx1 /dev/urandom | tr -d " \n")"
              printf "%s" "$keyring_password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              unset keyring_password
              go test ./backend -run "^(TestFarmClientInstalledArtifactNativeEnrollmentIdentity|TestFarmClientLinuxSecretServiceNativeOptIn)$" -count=1 -timeout=3m -v
            '
          C8_INSTALLED_AUTOSTART_E2E=1 \
          C8_INSTALLED_CLIENT="/opt/ant-farm-client/ant-farm-client" \
          C8_INSTALLED_ROOT="/opt/ant-farm-client" \
          C8_AUTOSTART_METHOD="systemd-user" \
          go test ./backend -run '^TestFarmClientInstalledArtifactAutostartNative$' -count=1 -v
          base_version="${version%%-*}"
          IFS=. read -r major minor patch <<< "$base_version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          version_b="$major.$minor.$((10#$patch + 1))"
          release_a="$RUNNER_TEMP/AntFarmClient-${version}-linux-${{ matrix.arch }}.update.bin"
          cp "$(realpath "$(ls publish/farm-client/linux/dist/AntFarmClient-${version}-linux-${{ matrix.arch }}.update.bin)")" "$release_a"
          release_b="$RUNNER_TEMP/AntFarmClient-${version_b}-linux-${{ matrix.arch }}.update.bin"
          GOOS=linux GOARCH="${{ matrix.arch }}" CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X ant-chrome/backend.FarmClientVersion=$version_b" \
            -o "$release_b" ./backend/cmd/ant-farm-client
          C8_INSTALLED_UPDATE_E2E=1 \
          C8_UPDATE_INSTALLED_CLIENT="/opt/ant-farm-client/ant-farm-client" \
          C8_UPDATE_INSTALLED_ROOT="/opt/ant-farm-client" \
          C8_UPDATE_RELEASE_A="$release_a" \
          C8_UPDATE_RELEASE_B="$release_b" \
          C8_UPDATE_RELEASE_A_SHA256="$(sha256sum "$release_a" | awk '{print $1}')" \
          C8_UPDATE_RELEASE_B_SHA256="$(sha256sum "$release_b" | awk '{print $1}')" \
          C8_UPDATE_VERSION_A="$version" \
          C8_UPDATE_VERSION_B="$version_b" \
          go test ./backend -run '^TestFarmClientInstalledArtifactSignedUpdateRollback$' -count=1 -timeout=10m -v
          sudo dpkg -r ant-farm-client
          trap - EXIT
          test ! -e /opt/ant-farm-client/ant-farm-client
      - uses: actions/upload-artifact@v4
        with:
          name: ant-farm-client-linux-${{ matrix.variant }}
          path: |
            publish/farm-client/linux/dist/ant-farm-client_*_${{ matrix.arch }}.deb
            publish/farm-client/linux/dist/AntFarmClient-*-linux-${{ matrix.arch }}.tar.gz
            publish/farm-client/linux/dist/AntFarmClient-*-linux-${{ matrix.arch }}.update.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/farm-client-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: ant-farm-client-linux-ubuntu-24.04-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" release-artifacts/* --clobber
